name: What If Automation

on:
workflow_dispatch:
schedule:
- cron: '30 3 * * *'

permissions:
contents: read

jobs:
generate:
runs-on: ubuntu-latest

steps:
  - name: Get project files
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'

  - name: Generate script
    run: python generate_script.py

  - name: Save generated script
    uses: actions/upload-artifact@v4
    with:
      name: what-if-script
      path: output/
      if-no-files-found: error
      retention-days: 7
